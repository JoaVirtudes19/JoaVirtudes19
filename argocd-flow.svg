<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#1f6feb"/><stop offset="1" stop-color="#8957e5"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b3e"/><stop offset="1" stop-color="#1e1036"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.box{fill:#161b22;stroke:url(#g);stroke-width:2}
.t{fill:#e6edf3;font-size:14px;font-weight:600}
.s{fill:#8b949e;font-size:11.5px}
.ln{fill:none;stroke:#30363d;stroke-width:2.5}
.flow{fill:none;stroke:url(#g);stroke-width:2.5;stroke-dasharray:6 10;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.app{fill:#0d1117;stroke:#8957e5;stroke-width:1.5;animation:pulse 3.5s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke:#8957e5;stroke-opacity:.5}50%{stroke:#58a6ff;stroke-opacity:1}}
.spin{transform-origin:794px 75px;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
